[defaults]
# Inventory file location
inventory = ./inventory

# Remote user untuk SSH
remote_user = ubuntu

# Disable host key checking untuk lab environment
host_key_checking = False

# Lokasi roles
roles_path = ./roles

# Retry files
retry_files_enabled = False

# Timeout settings
timeout = 30
gather_timeout = 30

# Forks untuk parallel execution
forks = 10

# Log output
log_path = ./ansible.log

# Callback plugin untuk output yang lebih baik
stdout_callback = yaml
callback_whitelist = profile_tasks

[privilege_escalation]
# Privilege escalation settings
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH connection settings
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
