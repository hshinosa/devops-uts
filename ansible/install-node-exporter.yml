---
# Playbook: Install Node Exporter
# Tugas: Anggota 4 - Ansible Infrastructure Setup
# Deskripsi: Menginstal Prometheus Node Exporter untuk monitoring metrics

- name: Install Node Exporter
  hosts: all
  become: true
  gather_facts: true

  vars:
    node_exporter_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    node_exporter_install_dir: "/usr/local/bin"
    node_exporter_textfile_dir: "/var/lib/node_exporter/textfile_collector"

  tasks:
    # ==========================================
    # Create Node Exporter User and Group
    # ==========================================
    - name: Create node_exporter group
      ansible.builtin.group:
        name: "{{ node_exporter_group }}"
        state: present
        system: true

    - name: Create node_exporter user
      ansible.builtin.user:
        name: "{{ node_exporter_user }}"
        group: "{{ node_exporter_group }}"
        shell: /usr/sbin/nologin
        system: true
        create_home: false
        state: present

    # ==========================================
    # Download and Install Node Exporter
    # ==========================================
    - name: Create temporary directory for download
      ansible.builtin.tempfile:
        state: directory
        suffix: node_exporter
      register: temp_dir

    - name: Download Node Exporter
      ansible.builtin.get_url:
        url: "{{ node_exporter_download_url }}"
        dest: "{{ temp_dir.path }}/node_exporter.tar.gz"
        mode: '0644'

    - name: Extract Node Exporter
      ansible.builtin.unarchive:
        src: "{{ temp_dir.path }}/node_exporter.tar.gz"
        dest: "{{ temp_dir.path }}"
        remote_src: true

    - name: Copy Node Exporter binary
      ansible.builtin.copy:
        src: "{{ temp_dir.path }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
        dest: "{{ node_exporter_install_dir }}/node_exporter"
        owner: root
        group: root
        mode: '0755'
        remote_src: true
      notify: Restart Node Exporter

    - name: Clean up temporary directory
      ansible.builtin.file:
        path: "{{ temp_dir.path }}"
        state: absent

    # ==========================================
    # Create Directories
    # ==========================================
    - name: Create textfile collector directory
      ansible.builtin.file:
        path: "{{ node_exporter_textfile_dir }}"
        state: directory
        owner: "{{ node_exporter_user }}"
        group: "{{ node_exporter_group }}"
        mode: '0755'

    # ==========================================
    # Configure Systemd Service
    # ==========================================
    - name: Create Node Exporter systemd service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          Documentation=https://prometheus.io/docs/guides/node-exporter/
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ node_exporter_user }}
          Group={{ node_exporter_group }}
          ExecStart={{ node_exporter_install_dir }}/node_exporter \
            --web.listen-address=:{{ node_exporter_port }} \
            --collector.textfile.directory={{ node_exporter_textfile_dir }} \
            --collector.filesystem.mount-points-exclude="^/(sys|proc|dev|host|etc)($$|/)" \
            --collector.netclass.ignored-devices="^(veth.*|docker.*|br-.*)$$" \
            --collector.netdev.device-exclude="^(veth.*|docker.*|br-.*)$$"

          SyslogIdentifier=node_exporter
          Restart=always
          RestartSec=5

          # Security settings
          NoNewPrivileges=yes
          ProtectSystem=strict
          ProtectHome=yes
          PrivateTmp=yes
          PrivateDevices=yes
          ProtectKernelTunables=yes
          ProtectKernelModules=yes
          ProtectControlGroups=yes
          ReadOnlyPaths=/
          ReadWritePaths={{ node_exporter_textfile_dir }}

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload systemd
        - Restart Node Exporter

    # ==========================================
    # Start and Enable Service
    # ==========================================
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start and enable Node Exporter service
      ansible.builtin.systemd:
        name: node_exporter
        state: started
        enabled: true

    # ==========================================
    # Configure Firewall (if UFW is active)
    # ==========================================
    - name: Check if UFW is installed
      ansible.builtin.command: which ufw
      register: ufw_installed
      changed_when: false
      failed_when: false

    - name: Allow Node Exporter port through firewall
      community.general.ufw:
        rule: allow
        port: "{{ node_exporter_port }}"
        proto: tcp
        comment: 'Node Exporter'
      when: ufw_installed.rc == 0

    # ==========================================
    # Verification
    # ==========================================
    - name: Wait for Node Exporter to start
      ansible.builtin.wait_for:
        port: "{{ node_exporter_port }}"
        host: 127.0.0.1
        delay: 2
        timeout: 30

    - name: Verify Node Exporter is running
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
        return_content: false
        status_code: 200
      register: node_exporter_check
      retries: 3
      delay: 5
      until: node_exporter_check.status == 200

    - name: Get Node Exporter version
      ansible.builtin.command: "{{ node_exporter_install_dir }}/node_exporter --version"
      register: node_exporter_version_output
      changed_when: false

    - name: Display Node Exporter status
      ansible.builtin.debug:
        msg: |
          Node Exporter installed successfully!
          Version: {{ node_exporter_version_output.stdout_lines[0] }}
          Metrics endpoint: http://{{ ansible_default_ipv4.address | default(ansible_host) }}:{{ node_exporter_port }}/metrics

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
