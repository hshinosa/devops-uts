global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'devops-node'

  - job_name: 'backend'
    metrics_path: /api/metrics
    static_configs:
      - targets: ['host.docker.internal:3000']  # kalau Prometheus di Docker, app di Windows lokal
        labels:
          service: 'todo-backend'
